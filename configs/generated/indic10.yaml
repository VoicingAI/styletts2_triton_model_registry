# Generated by tools/generate_configs.py from speaker_configs.json +
# speaker_languages.json. Review before use -- in particular `plbert`, which is
# inferred from the speakers' languages.
#
#   python convert.py configs/generated/indic10.yaml --dry-run


model_id: indic10

stores:
  prod:
    type: s3
    bucket: verizon-audio-main
    access_key_env: AWS_ACCESS_KEY
    secret_key_env: AWS_SECRET_KEY
  b2:
    type: s3
    bucket: TTS-STT-servers
    endpoint_url: https://s3.us-east-005.backblazeb2.com
    access_key_env: B2_KEY_ID
    secret_key_env: B2_APP_KEY

defaults:
  store: prod

checkpoint:
  model: prodttsmodels/indic10/model.pth
  config: prodttsmodels/indic10/config_ft.yml

plbert:
  store: b2
  path: PLBERTs/multi

speakers:
  amala:
    reference: prodttsmodels/indic10/reference_malayalam.wav
    language: ml
  nandini:
    reference: prodttsmodels/indic10/reference_bengali.wav
    languages: [bn, en, hi]

export:
  device: cuda:0
  opset: 17
  modules: all
