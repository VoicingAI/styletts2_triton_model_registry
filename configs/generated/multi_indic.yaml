# Generated by tools/generate_configs.py from speaker_configs.json +
# speaker_languages.json. Review before use -- in particular `plbert`, which is
# inferred from the speakers' languages.
#
#   python convert.py configs/generated/multi_indic.yaml --dry-run


model_id: multi_indic

stores:
  prod:
    type: s3
    bucket: verizon-audio-main
    access_key_env: AWS_ACCESS_KEY
    secret_key_env: AWS_SECRET_KEY
  b2:
    type: s3
    bucket: TTS-STT-servers
    endpoint_url: https://s3.us-east-005.backblazeb2.com
    access_key_env: B2_KEY_ID
    secret_key_env: B2_APP_KEY

defaults:
  store: prod

checkpoint:
  model: multilingual/model.pth
  config: prodttsmodels/tania-v2/config_ft.yml

plbert:
  store: b2
  path: PLBERTs/multi

speakers:
  amar:
    reference: multilingual/test_Punjabi_newtext_4372.wav
    language: pa
  amit:
    reference: multilingual/train_gujaratimale_03401.wav
    language: gu
  anil:
    reference: multilingual/train_telugumale_03333.wav
    language: te
  arul:
    reference: multilingual/train_tamilmale_02232.wav
    language: ta
  chitra:
    reference: multilingual/train_englishfemale.wav
    languages: [bn, en, gu, hi, kn, mr, pa, ta, te]
  ishan:
    reference: multilingual/train_hindifullmale_03471.wav
    language: hi
  mira:
    reference: multilingual/train_bengalifemale_03333.wav
    language: bn
  siddh:
    reference: multilingual/text_marathi.wav
    language: mr
  ved:
    reference: multilingual/train_kannadafullmale_02427.wav
    language: kn

export:
  device: cuda:0
  opset: 17
  modules: all
